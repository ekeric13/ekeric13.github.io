<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Event Bus Architecture</title>
  <desc id="desc">A Postgres outbox flows through CDC and Kafka to product team HTTP handlers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c20"/><stop offset="1" stop-color="#0a1013"/></linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#54b8c9" stroke-opacity=".055"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#769197"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1065" cy="-35" r="330" fill="#54b8c9" opacity=".045"/>
  <text x="76" y="74" fill="#54b8c9" font-family="monospace" font-size="17" letter-spacing="4">CASE STUDY · PLATFORM ARCHITECTURE</text>
  <text x="76" y="158" fill="#edf4f5" font-family="Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Event Bus</text>
  <text x="76" y="218" fill="#edf4f5" font-family="Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Architecture</text>
  <text x="78" y="270" fill="#91a6ab" font-family="Arial, sans-serif" font-size="23">Outbox for consistency. Kafka for scale. HTTP for adoption.</text>
  <g transform="translate(76 340)" filter="url(#shadow)">
    <rect width="1048" height="176" rx="22" fill="#142128" stroke="#2c424a"/>
    <g transform="translate(28 28)"><rect width="178" height="94" rx="14" fill="#10262c" stroke="#54b8c9" stroke-opacity=".55"/><text x="89" y="41" fill="#edf4f5" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Product service</text><text x="89" y="68" fill="#91a6ab" text-anchor="middle" font-family="monospace" font-size="13">write event()</text></g>
    <path d="M218 75H274" stroke="#769197" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(290 20)"><rect width="232" height="110" rx="14" fill="#2d2518" stroke="#e0a458" stroke-opacity=".65"/><text x="116" y="29" fill="#e0a458" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="1">ONE TRANSACTION</text><rect x="18" y="46" width="91" height="46" rx="8" fill="#0e1518" stroke="#e0a458" stroke-dasharray="4 4"/><rect x="123" y="46" width="91" height="46" rx="8" fill="#0e1518" stroke="#54b8c9" stroke-dasharray="4 4"/><text x="64" y="73" fill="#edf4f5" text-anchor="middle" font-family="Arial" font-size="14">state row</text><text x="168" y="66" fill="#edf4f5" text-anchor="middle" font-family="Arial" font-size="14">outbox</text><text x="168" y="83" fill="#91a6ab" text-anchor="middle" font-family="monospace" font-size="10">event row</text></g>
    <path d="M534 75H580" stroke="#769197" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(596 28)"><rect width="118" height="94" rx="47" fill="#222239" stroke="#9a7be0" stroke-opacity=".65"/><text x="59" y="44" fill="#d7c9ff" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">CDC</text><text x="59" y="65" fill="#9f9ab3" text-anchor="middle" font-family="monospace" font-size="11">after commit</text></g>
    <path d="M726 75H770" stroke="#769197" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(786 28)"><rect width="108" height="94" rx="47" fill="#14291d" stroke="#5fb87a" stroke-opacity=".65"/><text x="54" y="46" fill="#81d39a" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Kafka</text><text x="54" y="67" fill="#8fa4a9" text-anchor="middle" font-family="monospace" font-size="11">replay + fanout</text></g>
    <path d="M906 75H942" stroke="#769197" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(958 28)"><rect width="64" height="42" rx="8" fill="#0e1518" stroke="#5fb87a" stroke-opacity=".7"/><rect y="52" width="64" height="42" rx="8" fill="#0e1518" stroke="#5fb87a" stroke-opacity=".7"/><text x="32" y="27" fill="#edf4f5" text-anchor="middle" font-family="monospace" font-size="11">HTTP</text><text x="32" y="79" fill="#edf4f5" text-anchor="middle" font-family="monospace" font-size="11">HTTP</text></g>
  </g>
  <text x="76" y="578" fill="#647b81" font-family="monospace" font-size="15" letter-spacing="2">ERIC KENNEDY</text>
  <text x="1124" y="578" fill="#647b81" text-anchor="end" font-family="monospace" font-size="14">5–10 SERVICES · 10–20 TOPICS</text>
</svg>
