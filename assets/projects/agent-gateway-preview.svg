<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Gateway</title>
  <desc id="desc">Multiple clients enter a shared gateway for authorization, sessions, routing, and tools before reaching domain agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11161d"/><stop offset="1" stop-color="#0b0d12"/></linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#4bd6c8" stroke-opacity=".06"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#778b9d"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/><circle cx="1050" cy="-20" r="360" fill="#ad8cff" opacity=".065"/>
  <text x="76" y="72" fill="#4bd6c8" font-family="monospace" font-size="17" letter-spacing="4">CASE STUDY · AI PLATFORM</text>
  <text x="76" y="156" fill="#eef3f8" font-family="Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">AI Agent Gateway</text>
  <text x="78" y="208" fill="#99a9b8" font-family="Arial, sans-serif" font-size="23">One runtime for tools, authorization, sessions, and enterprise workflows.</text>
  <g transform="translate(76 286)" filter="url(#shadow)">
    <rect width="1048" height="230" rx="22" fill="#151b23" stroke="#2a3541"/>
    <g transform="translate(28 35)" font-family="monospace" font-size="12" text-anchor="middle"><g><rect width="118" height="40" rx="10" fill="#10272a" stroke="#4bd6c8" stroke-opacity=".55"/><text x="59" y="25" fill="#d5e4e5">WEB</text></g><g transform="translate(0 55)"><rect width="118" height="40" rx="10" fill="#10272a" stroke="#4bd6c8" stroke-opacity=".55"/><text x="59" y="25" fill="#d5e4e5">SLACK</text></g><g transform="translate(0 110)"><rect width="118" height="40" rx="10" fill="#10272a" stroke="#4bd6c8" stroke-opacity=".55"/><text x="59" y="25" fill="#d5e4e5">CLI / MCP</text></g></g>
    <path d="M159 55C201 55 205 105 242 105M159 110H242M159 165C201 165 205 115 242 115" fill="none" stroke="#778b9d" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(260 20)"><rect width="410" height="180" rx="20" fill="#1d1b30" stroke="#ad8cff" stroke-width="2" stroke-opacity=".68"/><text x="205" y="36" fill="#eef3f8" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Shared gateway runtime</text><text x="205" y="59" fill="#ada8c1" text-anchor="middle" font-family="monospace" font-size="11">normalize · resume · stream · route</text><g transform="translate(22 78)" font-family="monospace" font-size="11" text-anchor="middle"><g><rect width="82" height="66" rx="11" fill="#13161d" stroke="#4bd6c8" stroke-opacity=".46"/><text x="41" y="29" fill="#4bd6c8">IDENTITY</text><text x="41" y="47" fill="#99a9b8">caller</text></g><g transform="translate(94)"><rect width="82" height="66" rx="11" fill="#13161d" stroke="#f0b05f" stroke-opacity=".46"/><text x="41" y="29" fill="#f0b05f">SESSION</text><text x="41" y="47" fill="#99a9b8">thread</text></g><g transform="translate(188)"><rect width="82" height="66" rx="11" fill="#13161d" stroke="#ad8cff" stroke-opacity=".46"/><text x="41" y="29" fill="#ad8cff">ROUTER</text><text x="41" y="47" fill="#99a9b8">agent</text></g><g transform="translate(282)"><rect width="82" height="66" rx="11" fill="#13161d" stroke="#69c982" stroke-opacity=".46"/><text x="41" y="29" fill="#69c982">POLICY</text><text x="41" y="47" fill="#99a9b8">tool call</text></g></g></g>
    <path d="M682 110H744" stroke="#778b9d" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(762 29)" font-family="Arial" text-anchor="middle"><g><rect width="126" height="46" rx="12" fill="#14281b" stroke="#69c982" stroke-opacity=".55"/><text x="63" y="28" fill="#dbe9df" font-size="13">Routing agent</text></g><g transform="translate(132)"><rect width="126" height="46" rx="12" fill="#14281b" stroke="#69c982" stroke-opacity=".55"/><text x="63" y="28" fill="#dbe9df" font-size="13">Access agent</text></g><g transform="translate(0 58)"><rect width="126" height="46" rx="12" fill="#14281b" stroke="#69c982" stroke-opacity=".55"/><text x="63" y="28" fill="#dbe9df" font-size="13">Capacity agent</text></g><g transform="translate(132 58)"><rect width="126" height="46" rx="12" fill="#14281b" stroke="#69c982" stroke-opacity=".55"/><text x="63" y="28" fill="#dbe9df" font-size="13">Expert agent</text></g><g transform="translate(0 116)"><rect width="258" height="46" rx="12" fill="#14281b" stroke="#69c982" stroke-opacity=".55"/><text x="129" y="28" fill="#69c982" font-size="13" font-weight="700">20+ domain agents</text></g></g>
  </g>
  <text x="76" y="574" fill="#637486" font-family="monospace" font-size="15" letter-spacing="2">ERIC KENNEDY</text>
  <text x="1124" y="574" fill="#69c982" text-anchor="end" font-family="monospace" font-size="15">WEEKS → 1–2 DAYS TO ONBOARD</text>
